version: "1"
package:
  id: com.github.linglongdev.fynedemo
  name: fyne demo
  version: 1.0.0.0
  kind: app
  description: |
    fyne demo

base: org.deepin.base/25.2.1

command:
  - fyne-hello-go

build: |
  tar --strip-components=1 --no-same-owner -xvf /project/linglong/sources/go.tar.gz -C $PREFIX/
  # 需要设置GOCACHE
  export GOCACHE=$PWD/linglong/cache/go-build
  go build
  # golang 构建后不需要保留
  rm -r $PREFIX/*
  mkdir $PREFIX/bin
  mv fyne-hello-go $PREFIX/bin

buildext:
  apt:
    build_depends:
      - libgl1-mesa-dev
      - xorg-dev
      - libxkbcommon-dev

sources:
  - kind: file
    url: https://mirrors.aliyun.com/golang/go1.26.0.linux-amd64.tar.gz
    name: go.tar.gz
    digest: aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235
